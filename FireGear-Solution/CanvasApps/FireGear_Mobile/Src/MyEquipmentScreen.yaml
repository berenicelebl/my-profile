- Control: Screen
  Name: MyEquipmentScreen
  Properties:
    Fill: =RGBA(26, 26, 26, 1)

  Children:

  # ── Header ───────────────────────────────────────────────────────────────────
  - Control: Rectangle
    Name: rectHeader
    Properties:
      Fill: =RGBA(180, 20, 20, 1)
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =80

  - Control: Button
    Name: btnBack
    Properties:
      Text: ="← Back"
      X: =8
      Y: =20
      Width: =90
      Height: =40
      Fill: =RGBA(0, 0, 0, 0)
      Color: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(0, 0, 0, 0)
      FontWeight: =FontWeight.Semibold
      OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

  - Control: Label
    Name: lblScreenTitle
    Properties:
      Text: ="My Equipment"
      X: =0
      Y: =20
      Width: =Parent.Width
      Height: =40
      Color: =RGBA(255, 255, 255, 1)
      Size: =20
      FontWeight: =FontWeight.Bold
      Align: =Align.Center

  # ── Summary badges ────────────────────────────────────────────────────────
  - Control: Rectangle
    Name: rectSummaryBg
    Properties:
      Fill: =RGBA(35, 35, 35, 1)
      X: =0
      Y: =80
      Width: =Parent.Width
      Height: =70

  - Control: Label
    Name: lblSummaryCount
    Properties:
      Text: =Text(CountRows(colMyEquipment)) & " items assigned to you"
      X: =20
      Y: =96
      Width: =Parent.Width - 40
      Height: =38
      Color: =RGBA(200, 200, 200, 1)
      Size: =15

  # ── Empty state ──────────────────────────────────────────────────────────
  - Control: Label
    Name: lblEmpty
    Properties:
      Text: ="No equipment currently assigned to you."
      X: =20
      Y: =200
      Width: =Parent.Width - 40
      Height: =40
      Color: =RGBA(150, 150, 150, 1)
      Size: =15
      Align: =Align.Center
      Visible: =CountRows(colMyEquipment) = 0

  - Control: Button
    Name: btnEmptyRequest
    Properties:
      Text: ="Submit a Request"
      X: =Parent.Width / 2 - 100
      Y: =260
      Width: =200
      Height: =48
      Fill: =RGBA(180, 20, 20, 1)
      Color: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(0, 0, 0, 0)
      RadiusTopLeft: =24
      RadiusTopRight: =24
      RadiusBottomLeft: =24
      RadiusBottomRight: =24
      Visible: =CountRows(colMyEquipment) = 0
      OnSelect: =Navigate(NewRequestScreen, ScreenTransition.Fade)

  # ── Equipment gallery ─────────────────────────────────────────────────────
  - Control: Gallery
    Name: galMyEquipment
    Variant: galleryVertical
    Properties:
      Items: =colMyEquipment
      X: =0
      Y: =160
      Width: =Parent.Width
      Height: =Parent.Height - 160
      TemplatePadding: =8
      TemplateSize: =100
      Visible: =CountRows(colMyEquipment) > 0
    Children:
    - Control: Rectangle
      Name: rectCard
      Properties:
        Fill: =RGBA(40, 40, 40, 1)
        X: =16
        Y: =4
        Width: =Parent.Width - 32
        Height: =88
        RadiusTopLeft: =10
        RadiusTopRight: =10
        RadiusBottomLeft: =10
        RadiusBottomRight: =10

    - Control: Label
      Name: lblEquipmentName
      Properties:
        Text: =ThisItem.fg_equipmentid.fg_equipmentname
        X: =32
        Y: =16
        Width: =Parent.Width - 120
        Height: =28
        Color: =RGBA(255, 255, 255, 1)
        Size: =16
        FontWeight: =FontWeight.Semibold

    - Control: Label
      Name: lblCategory
      Properties:
        Text: =Text(ThisItem.fg_equipmentid.fg_category)
        X: =32
        Y: =44
        Width: =Parent.Width - 120
        Height: =22
        Color: =RGBA(180, 180, 180, 1)
        Size: =13

    - Control: Label
      Name: lblQuantity
      Properties:
        Text: ="Qty: " & Text(ThisItem.fg_quantity)
        X: =32
        Y: =66
        Width: =100
        Height: =20
        Color: =RGBA(160, 160, 160, 1)
        Size: =12

    - Control: Label
      Name: lblDateAssigned
      Properties:
        Text: ="Assigned: " & Text(ThisItem.fg_dateassigned, DateTimeFormat.ShortDate)
        X: =150
        Y: =66
        Width: =Parent.Width - 180
        Height: =20
        Color: =RGBA(160, 160, 160, 1)
        Size: =12

    - Control: Rectangle
      Name: rectStatusDot
      Properties:
        Fill: =RGBA(50, 200, 80, 1)
        X: =Parent.Width - 56
        Y: =20
        Width: =12
        Height: =12
        RadiusTopLeft: =6
        RadiusTopRight: =6
        RadiusBottomLeft: =6
        RadiusBottomRight: =6

    - Control: Label
      Name: lblStatusText
      Properties:
        Text: ="Active"
        X: =Parent.Width - 56
        Y: =34
        Width: =44
        Height: =18
        Color: =RGBA(50, 200, 80, 1)
        Size: =11
        Align: =Align.Center
